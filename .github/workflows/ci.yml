name: Verify Manga Library

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manga-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report bundle assets
        run: du -h dist/assets/* || true

  browser:
    name: Responsive, keyboard, touch and offline browser tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Playwright headless Chromium only
        run: npx playwright install --only-shell chromium
      - name: Run browser acceptance tests
        run: npm run test:e2e
      - name: Attach Playwright traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manga-browser-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  public-demo:
    name: Publish synthetic demo to GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified dependencies
        run: npm ci --no-audit --no-fund
      - name: Build sample-only site for GitHub Pages subpath
        run: npm run build -- --mode ghpages
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload only static compiled output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
